<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Section Extractor</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <h1 class="text-4xl font-bold text-center mb-8 text-indigo-600">PDF Section Extractor</h1>

        <div class="bg-white rounded-lg shadow-lg p-6">
            <label class="block mb-2 font-semibold text-gray-700">Upload a PDF</label>
            <input
                type="file"
                id="pdf-file"
                accept=".pdf,application/pdf"
                class="block w-full mb-4 border rounded p-2 text-gray-700"
            >
            <button
                id="extract-btn"
                class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 disabled:opacity-50"
            >
                Extract sections
            </button>
            <button
                id="save-btn"
                class="w-full mt-3 bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 disabled:opacity-50"
                disabled
            >
                Upload Current Schema to DB
            </button>

            <p id="status" class="mt-4 text-gray-600 text-sm hidden"></p>

            <div id="results" class="mt-6 hidden">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-xl font-semibold text-gray-700">Sections (preview)</h2>
                    <span id="section-count" class="text-sm text-gray-400"></span>
                </div>
                <div id="section-list" class="space-y-4"></div>
            </div>
        </div>
    </div>
    <div id="details-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center px-4">
        <div class="bg-white w-full max-w-lg rounded-lg shadow-lg p-6">
            <h3 class="text-lg font-semibold text-gray-800">Add Details Before Upload</h3>
            <p class="text-sm text-gray-600 mt-2">Enter details for this upload.</p>
            <textarea
                id="details-input"
                class="w-full mt-3 border rounded p-2 text-gray-700"
                rows="4"
                placeholder="Enter details..."
            ></textarea>
            <div class="mt-4 flex justify-end space-x-2">
                <button id="details-cancel-btn" class="px-4 py-2 rounded border text-gray-700">Cancel</button>
                <button id="details-submit-btn" class="px-4 py-2 rounded bg-green-600 text-white hover:bg-green-700">Submit & Upload</button>
            </div>
        </div>
    </div>

    <script>
        const extractBtn = document.getElementById("extract-btn");
        const pdfFileInput = document.getElementById("pdf-file");
        const statusEl = document.getElementById("status");
        const resultsEl = document.getElementById("results");
        const sectionCountEl = document.getElementById("section-count");
        const sectionListEl = document.getElementById("section-list");
        const saveBtn = document.getElementById("save-btn");
        const detailsModal = document.getElementById("details-modal");
        const detailsInput = document.getElementById("details-input");
        const detailsCancelBtn = document.getElementById("details-cancel-btn");
        const detailsSubmitBtn = document.getElementById("details-submit-btn");
        let lastExtraction = null;
        let saveInFlight = false;

        function escapeHtml(s) {
            if (s == null || s === "") return "";
            const d = document.createElement("div");
            d.textContent = String(s);
            return d.innerHTML;
        }

        function showStatus(message) {
            statusEl.textContent = message;
            statusEl.classList.remove("hidden");
        }

        function resetResults() {
            resultsEl.classList.add("hidden");
            sectionCountEl.textContent = "";
            sectionListEl.innerHTML = "";
            lastExtraction = null;
            saveBtn.disabled = true;
            saveBtn.classList.remove("hidden");
        }

        function openDetailsModal() {
            detailsInput.value = "";
            detailsModal.classList.remove("hidden");
            detailsModal.classList.add("flex");
            detailsInput.focus();
        }

        function closeDetailsModal() {
            detailsModal.classList.add("hidden");
            detailsModal.classList.remove("flex");
        }

        function renderSections(sections) {
            sectionListEl.innerHTML = "";
            sections.forEach((item) => {
                const card = document.createElement("div");
                card.className = "border border-gray-200 rounded-lg p-4 bg-gray-50";

                const meta = document.createElement("div");
                meta.className = "text-xs text-gray-500 mb-2";
                meta.innerHTML = `Order <strong>${escapeHtml(item.section_order)}</strong> · id <code class="bg-gray-200 px-1 rounded">${escapeHtml(item.section_id)}</code>`;
                card.appendChild(meta);

                const title = document.createElement("h3");
                title.className = "text-gray-900 font-semibold text-lg";
                title.textContent = item.section_name || "(no name)";
                card.appendChild(title);

                if (item.section_description) {
                    const desc = document.createElement("p");
                    desc.className = "text-gray-700 text-sm mt-2 whitespace-pre-wrap";
                    desc.textContent = item.section_description;
                    card.appendChild(desc);
                }

                const content = document.createElement("div");
                content.className = "text-gray-800 text-sm mt-2 max-h-32 overflow-y-auto whitespace-pre-wrap border-t border-gray-200 pt-2";
                const c = item.section_content || "";
                content.textContent = c.length > 800 ? c.slice(0, 800) + "…" : c;
                card.appendChild(content);

                const ql = Array.isArray(item.section_question_list) ? item.section_question_list : [];
                const qlLabel = document.createElement("p");
                qlLabel.className = "text-xs font-semibold text-gray-600 mt-3";
                qlLabel.textContent = `section_question_list (${ql.length} items, metadata)`;
                card.appendChild(qlLabel);
                const pre = document.createElement("pre");
                pre.className = "text-xs bg-white border rounded p-2 mt-1 overflow-x-auto max-h-24 overflow-y-auto";
                pre.textContent = JSON.stringify(ql, null, 2);
                card.appendChild(pre);

                sectionListEl.appendChild(card);
            });
        }

        extractBtn.addEventListener("click", async () => {
            const file = pdfFileInput.files[0];
            if (!file) {
                showStatus("Please select a PDF file.");
                return;
            }

            extractBtn.disabled = true;
            extractBtn.textContent = "Extracting…";
            resetResults();
            showStatus(`Processing "${file.name}"…`);

            try {
                const formData = new FormData();
                formData.append("file", file);

                const response = await fetch("/extract-topics-from-pdf", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || "Failed to extract sections");
                }

                const sections = Array.isArray(data.sections)
                    ? data.sections
                    : (Array.isArray(data.Sections) ? data.Sections : []);
                lastExtraction = {
                    filename: data.filename,
                    sections
                };
                renderSections(sections);
                sectionCountEl.textContent = `${sections.length} sections · ${data.page_count} pages`;
                resultsEl.classList.remove("hidden");
                saveBtn.disabled = sections.length === 0;
                showStatus(`Done: ${data.filename} (preview only — not saved to DB)`);
            } catch (error) {
                showStatus(`Error: ${error.message}`);
            } finally {
                extractBtn.disabled = false;
                extractBtn.textContent = "Extract sections";
            }
        });

        detailsCancelBtn.addEventListener("click", () => {
            if (saveInFlight) return;
            closeDetailsModal();
        });

        saveBtn.addEventListener("click", () => {
            if (!lastExtraction || !Array.isArray(lastExtraction.sections) || lastExtraction.sections.length === 0) {
                showStatus("Please extract sections before uploading to DB.");
                return;
            }
            openDetailsModal();
        });

        detailsSubmitBtn.addEventListener("click", async () => {
            if (saveInFlight) return;
            if (!lastExtraction || !lastExtraction.filename) {
                showStatus("No extracted file found. Please extract again.");
                closeDetailsModal();
                return;
            }

            try {
                saveInFlight = true;
                saveBtn.disabled = true;
                saveBtn.textContent = "Uploading…";
                detailsSubmitBtn.disabled = true;
                detailsSubmitBtn.textContent = "Submitting…";
                showStatus("Checking if file already exists…");

                const duplicateCheckResponse = await fetch("/check-extracted-topics-file-name", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ file_name: lastExtraction.filename })
                });
                const duplicateData = await duplicateCheckResponse.json();
                if (!duplicateCheckResponse.ok) {
                    throw new Error(duplicateData.detail || "Failed to check file-name duplicates");
                }

                let forceProceed = false;
                if (duplicateData.exists) {
                    const proceed = window.confirm(
                        `File "${lastExtraction.filename}" already exists (${duplicateData.existing_count} records). Do you want to proceed?`
                    );
                    if (!proceed) {
                        showStatus("Upload cancelled.");
                        return;
                    }
                    forceProceed = true;
                }

                showStatus("Saving sections to DB…");
                const response = await fetch("/save-extracted-topics", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        file_name: lastExtraction.filename,
                        details: detailsInput.value || null,
                        force_proceed: forceProceed,
                        sections: lastExtraction.sections
                    })
                });

                const data = await response.json();
                if (!response.ok) {
                    const detail = typeof data.detail === "string" ? data.detail : (data.detail?.message || "Failed to save to DB");
                    throw new Error(detail);
                }

                showStatus(
                    `Saved: kb_source_id=${data.kb_source_id}, sections=${data.section_count}`
                );
                saveBtn.classList.add("hidden");
                closeDetailsModal();
            } catch (error) {
                showStatus(`Error: ${error.message}`);
            } finally {
                saveInFlight = false;
                saveBtn.disabled = false;
                saveBtn.textContent = "Upload Current Schema to DB";
                detailsSubmitBtn.disabled = false;
                detailsSubmitBtn.textContent = "Submit & Upload";
            }
        });
    </script>
</body>
</html>
